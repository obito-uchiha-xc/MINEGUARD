version: "3.8"

services:
  # Primary Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mine-safety-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Integrated Mine Safety Monitoring System Backend
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+psycopg://mine_admin:change_in_production_password@postgres:5432/mine_safety
      - CORS_ALLOWED_ORIGINS=["*"]
      - DB_POOL_PRE_PING=true
      - DB_POOL_RECYCLE_S=1800
      - WS_KEEPALIVE_INTERVAL_S=30
      - NODE_UNRESPONSIVE_TIMEOUT_S=60
      - AI_ANOMALY_ZSCORE_THRESHOLD=3.0
      - MAX_TELEMETRY_READINGS_PER_REQUEST=500
    depends_on:
      postgres:
        condition: service_healthy

  # Relational & Time-Series Persistent Storage Target
  postgres:
    image: postgres:16-alpine
    container_name: mine-safety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mine_admin
      POSTGRES_PASSWORD: change_in_production_password
      POSTGRES_DB: mine_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mine_admin -d mine_safety"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
